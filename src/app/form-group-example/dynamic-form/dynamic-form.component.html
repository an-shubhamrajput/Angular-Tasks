 <div class="container mt-5">
    <h4 class="text-secondary">Reactive Dynamic Form</h4>

    <form [formGroup]="companyData" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class="col-md-6 mb-4">
                <label for="companyName" class="form-label">Company Name *</label>
                <input  type="text" id="companyName" class="form-control" formControlName="companyName">
                <div *ngIf="companyData.get('companyName')?.invalid && companyData.get('companyName')?.touched" class="text-danger">
                    This field is required 
                </div>
            </div>
            <div formGroupName="address" class="col-md-6 mb-3">
              <label for="country" class="form-label">Country</label>
              <input type="text" id="country" class="form-control" formControlName="country">
          </div>
        </div>
       
        <div formGroupName="address">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" class="form-control" formControlName="city">
                </div>
                <div class="col-md-4 mb-3">
                  <label for="city" class="form-label">Street</label>
                  <input type="text" id="city" class="form-control" formControlName="city">
              </div>
                <div class="col-md-4 mb-3">
                    <label for="zip" class="form-label">Zip</label>
                    <input type="text" id="zip" class="form-control" formControlName="zip">
                </div>
            </div>
        </div>
        
        <div class="mt-4 p-4 border border-light rounded shadow">
          <h5 class="text-secondary">Units</h5>
          <form formArrayName="units">
          <div>
            <div *ngFor="let unit of units.controls; let i = index" [formGroupName]="i" class="row align-items-center">
              <div class="col-md-4">
                <label class="form-label">Unit Name *</label>
                <input type="text" class="form-control" formControlName="unitName">
                <div *ngIf="unit.get('unitName')?.invalid && unit.get('unitName')?.touched" class="text-danger">
                  Required
                </div>
              </div>
            
              <div class="col-md-2">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" formControlName="quantity">
              </div>
    
              <div class="col-md-3">
                <label class="form-label">Unit Price *</label>
                <input type="number" class="form-control" formControlName="unitPrice">
                <div *ngIf="unit.get('unitPrice')?.invalid && unit.get('unitPrice')?.touched" class="text-danger">
                  Required
                </div>
              </div>
    
              <div class="col-md-2">
                <label class="form-label">Total</label>
                <input type="text" class="form-control" [value]="calculateTotal(i)" readonly>
              </div>
    
              <div class="col-md-1 text-center">
                <button type="button" class="btn btn-danger mt-4" (click)="removeUnit(i)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
                    <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
                  </svg>
                </button>
              </div>
              
            </div>
          </div>
        </form>
        <button type="button" class="btn btn-outline-primary mt-3" (click)="addUnit()">+ Add New Unit</button>
      </div>
        <div class="mt-3 p-4 shadow">
          <h6>Total Price: <strong>{{totalPrice()}}</strong></h6>
        </div>
       
        <button *ngIf="currentIndex" type="submit" class="btn btn-outline-success mt-3" [disabled]="companyData.invalid">Update</button>
        
        <button *ngIf="!currentIndex" type="submit" class="btn btn-outline-success mt-3" [disabled]="companyData.invalid">Submit</button>
        <button routerLink="/company-data"  type="button" class="btn btn-outline-primary mt-3 mx-3">Display Data</button>
    </form>
    
</div>
